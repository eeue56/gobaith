name: Android Tests

on:
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  android-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # Minimal permissions for this workflow
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install ts-node globally
        run: npm install -g ts-node
      
      - name: Check TypeScript compilation
        run: tsc --noEmit
      
      - name: Build the web code
        run: npm run build
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Prepare Android build
        run: npm run prepare-android
      
      - name: Generate Gradle wrapper
        run: cd android && gradle wrapper --gradle-version 8.5
      
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew
      
      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      
      - name: Install Playwright with Android support
        run: npx playwright install --with-deps
      
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      
      - name: Run Android tests with emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: npm run test-android
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
